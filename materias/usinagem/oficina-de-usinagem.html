function parseG(src, opt){
  const P = Object.assign({}, SIMDEF, typeof opt === 'number' ? {rapid:opt} : (opt || {}));
  const lines = String(src).split(/\r?\n/), moves = [], blocks = [], errors = [], warns = [];
  const err = (li, msg) => { if(!errors.some(e => e.line === li && e.msg === msg)) errors.push({line:li, msg}); };
  const warned = new Set(), warn = (li, msg, key) => { if(key && warned.has(key)) return; if(key) warned.add(key); warns.push({line:li, msg}); };
  const clean = raw => raw.replace(/\(.*?\)/g, '').replace(/;.*/, '').toUpperCase().trim();
  // pré-leitura: bruto, subprogramas, ferramentas, primeira posição XY
  const subs = {}, tdefs = {}; let stock = null, firstX = null, firstY = null, seenO = false;
  lines.forEach((raw, li) => {
    const U = raw.toUpperCase(), s = clean(raw);
    const sm = U.match(/\(\s*STOCK\s+X\s*([\d.]+)\s+Y\s*([\d.]+)(?:\s+Z\s*([\d.]+))?/); if(sm && !stock) stock = {x:+sm[1], y:+sm[2], z:+(sm[3] || 50)};
    const om = s.match(/^O(\d+)/); if(om){ if(seenO && subs[+om[1]] == null) subs[+om[1]] = li; seenO = true; }
    const tm = s.match(/T\s*(\d+)/), cm = raw.match(/\((.*?)\)/);

    document.querySelectorAll('#sZtM [data-z]').forEach(b => b.onclick = () => { ztAll = b.dataset.z === 'a'; document.querySelectorAll('#sZtM [data-z]').forEach(x => x.classList.toggle('on', x === b)); drawZt(); });
    document.querySelector('#sZtM [data-z="b"]').classList.add('on');
    // parâmetros

    // inspeção e navegação 2D
    const st = $('sStage'); let down = null;
    st.addEventListener('pointermove', e => {
      if(view === '2d' && drag2){ const dp = devicePixelRatio || 1; v2.x += (e.clientX - drag2.x) * dp; v2.y += (e.clientY - drag2.y) * dp; drag2.x = e.clientX; drag2.y = e.clientY; drag2.moved = true; fit2(); need2d = true; return; }
      if(down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4){ hideTip(); return; }
      if(e.pointerType === 'mouse') inspect(e);
    });
    st.addEventListener('pointerleave', () => { hideTip(); if(hov){ hov = null; need2d = true; } });
    st.addEventListener('pointerdown', e => { if(e.target.closest('.sim-tip')) return; down = {x:e.clientX, y:e.clientY}; if(view === '2d'){ drag2 = {x:e.clientX, y:e.clientY, moved:false}; st.setPointerCapture(e.pointerId); } });
    st.addEventListener('pointerup', e => {
      const moved = down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5; down = null; drag2 = null;
      if(moved) return;

    });
    st.addEventListener('wheel', e => { if(view !== '2d') return; e.preventDefault(); const rc = st.getBoundingClientRect(), dp = devicePixelRatio || 1, mx = (e.clientX - rc.left) * dp, my = (e.clientY - rc.top) * dp; const f = Math.exp(-e.deltaY * 0.0015), wx = (mx - map2.ox) / map2.sc, wy = (map2.oy - my) / map2.sc; v2.z = Math.max(0.5, Math.min(40, v2.z * f)); fit2(); v2.x += mx - X2(wx); v2.y += my - Y2(wy); fit2(); need2d = true; }, {passive:false});
    st.addEventListener('dblclick', () => { if(view === '2d'){ fit2(true); need2d = true; } });
    io = new IntersectionObserver(es => { vis = es[0].isIntersecting; }); io.observe($('sim'));
    if(!ro){ ro = new ResizeObserver(resize); ro.observe(st); }
    resize(); load(); setView(view); lastT = 0; raf = requestAnimationFrame(loop);
  }
  function unmount(){
    cancelAnimationFrame(raf); raf = 0; play = null; clearTimeout(edT);
    if(io){ io.disconnect(); io = null; } if(ro){ ro.disconnect(); ro = null; }
    if(T3){ try{ T3.ctl.dispose(); T3.sc.traverse(c => { if(c.geometry) c.geometry.dispose(); if(c.material){ if(c.material.map) c.material.map.dispose(); c.material.dispose(); } }); T3.r.dispose(); T3.r.forceContextLoss(); T3.r.domElement.remove(); }catch(e){} T3 = null; }
    edLines = null; map2 = null; img = null;

  return {html, mount, unmount, get state(){ return {R, cur, view, play:!!play}; }, act, jump, setView, setCam};
})();

/* ===================== Comparação G73 × G83 ===================== */
const GCmp = (() => {
  let res = null, anim = 0, t0 = 0;
  const fld = (k, l, u, v) => `<label class="fld">${l}<span class="inp"><input data-c="${k}" value="${String(v).replace('.', ',')}" inputmode="decimal"><span>${u}</span></span></label>`;
  function html(){
    const v = Object.assign({Z:-6, R:2, Q:0.5, F:80, S:1600, D:6}, store.get('cmp', {}));
    return `<div class="cmp" id="cmp">
      <div class="cmp-in">${fld('D', 'Broca Ø', 'mm', v.D)}${fld('Z', 'Fundo Z', 'mm', v.Z)}${fld('R', 'Plano R', 'mm', v.R)}${fld('Q', 'Bicada Q', 'mm', v.Q)}${fld('F', 'Avanço F', 'mm/min', v.F)}${fld('S', 'Rotação S', 'rpm', v.S)}</div>
      <div class="cmp-out"><div class="cmp-cols" id="cmpK"></div>
        <div class="cmp-chart"><canvas id="cmpCv"></canvas></div>
        <div class="cmp-bar"><button class="btn primary" id="cmpPlay" type="button">${ic('play', 2)}Animar em tempo real</button><span id="cmpT"></span></div>
        <div id="cmpTxt"></div></div></div>`;
  }
  function series(g, v, P){
    const prog = `G21 G17 G90 G94\nT1 M06 (BROCA D${v.D})\nG00 X0 Y0 S${v.S} M03\nG43 H01 Z${v.R + 10}\nG99 G${g} X0 Y0 Z${v.Z} R${v.R} Q${v.Q} F${v.F}\nG80\nM30`;
    const r = parseG(prog, P), b = r.blocks.find(b => b.cyc); if(!b) return null;
    const mv = r.moves.slice(b.m0, b.m1).filter(m => m.kind !== 'ev' || m.t > 0); let t = 0; const pts = [[0, mv[0] ? mv[0].a.z : v.R]];
    mv.forEach(m => { t += m.t; pts.push([t, m.b.z]); });
    return {g, pts, T:t, steps:mv.length, pecks:mv.filter(m => m.kind === 'feed').length, feed:mv.filter(m => m.kind === 'feed').reduce((s, m) => s + m.len, 0), rap:mv.filter(m => m.kind === 'rapid').reduce((s, m) => s + m.len, 0), tf:mv.filter(m => m.kind === 'feed').reduce((s, m) => s + m.t, 0), err:r.errors};
  }
  function run(){
    if(!$('cmp')) return;
    const v = {}; document.querySelectorAll('#cmp [data-c]').forEach(i => v[i.dataset.c] = num(i.value)); store.set('cmp', v);
    const P = Object.assign({}, SIMDEF, store.get('simpar', {}));
    if(!(v.Q > 0) || !(v.R > v.Z) || !(v.F > 0)){ $('cmpK').innerHTML = '<p class="gerr">Confira: Q maior que zero, R acima do fundo e F maior que zero.</p>'; return; }
    const a = series(73, v, P), b = series(83, v, P); res = {a, b, v, P}; if(!a || !b) return;
    const col = (s, c) => `<div class="cmp-col ${c}"><h4>G${s.g} <small>${s.g === 73 ? 'quebra-cavaco: recua d = ' + fmtA(P.d73) + ' mm' : 'retração total ao R, folga d = ' + fmtA(P.d83) + ' mm'}</small></h4>
      <div class="cmp-k"><span>Tempo do furo</span><b>${fmt(s.T, 1)} s</b></div><div class="cmp-k"><span>Bicadas</span><b>${s.pecks}</b></div><div class="cmp-k"><span>Etapas (sub-passos)</span><b>${s.steps}</b></div>
      <div class="cmp-k"><span>Percurso em avanço</span><b>${fmt(s.feed, 1)} mm</b></div><div class="cmp-k"><span>Percurso em rápido</span><b>${fmt(s.rap, 1)} mm</b></div></div>`;
    $('cmpK').innerHTML = col(a, 'a') + col(b, 'b');
    const dT = b.T - a.T, depth = v.R - v.Z;
    $('cmpTxt').innerHTML = H.box('', `<p>Os dois fazem ${a.pecks} bicadas de ${fmtA(v.Q)} mm para vencer ${fmtA(depth)} mm (do plano R ao fundo). O G83 leva <strong>${fmt(dT, 1)} s a mais</strong> (${fmt(a.T ? dT / a.T * 100 : 0, 0)}%) porque a cada bicada a broca sobe até R e desce de novo em rápido; além disso, cada bicada recomeça ${fmtA(P.d83)} mm acima do fundo, em avanço, o que soma ${fmt(b.feed - a.feed, 1)} mm de corte no ar. No G73 a broca nunca sai do furo: o recuo de ${fmtA(P.d73)} mm só quebra o cavaco.</p><p>Na prática: G73 para furos de até umas 3 vezes o diâmetro em material de cavaco longo; G83 quando o cavaco precisa sair do furo (furo profundo, alumínio que empasta, broca pequena). Q de 0,5 mm é bicada curtíssima, típica de broca de Ø3 a Ø6 em aço inox ou de furo muito profundo.</p>`, 'blue');
    draw(null);
  }
  function draw(tNow){
    const cv = $('cmpCv'); if(!cv || !res || !res.a) return;
    const dp = devicePixelRatio || 1, cw = cv.clientWidth || 600, ch = cv.clientHeight || 220;
    if(cv.width !== Math.round(cw * dp)){ cv.width = Math.round(cw * dp); cv.height = Math.round(ch * dp); }
    const g = cv.getContext('2d'); g.setTransform(dp, 0, 0, dp, 0, 0); g.clearRect(0, 0, cw, ch);
    const {a, b, v} = res, Tm = Math.max(a.T, b.T), z0 = v.Z - 0.5, z1 = v.R + 10.5;
    const L = 44, Rr = 12, Tp = 12, Bt = 24, X = t => L + t / Tm * (cw - L - Rr), Y = z => Tp + (z1 - z) / (z1 - z0) * (ch - Tp - Bt);
    g.font = '10px IBM Plex Mono, monospace'; g.lineWidth = 1;
    niceTicks(z0, z1, 4).forEach(z => { g.strokeStyle = '#E4E9EF'; g.beginPath(); g.moveTo(L, Y(z)); g.lineTo(cw - Rr, Y(z)); g.stroke(); g.fillStyle = '#4A5A70'; g.textAlign = 'right'; g.fillText(fmtA(z), L - 5, Y(z) + 3); });
    niceTicks(0, Tm, 6).forEach(t => { g.fillStyle = '#4A5A70'; g.textAlign = 'center'; g.fillText(fmtA(t) + 's', X(t), ch - 8); });
    [[v.R, '#1F6FB2', 'R'], [v.Z, '#B42318', 'fundo'], [0, '#8A9AB0', 'face']].forEach(([z, c, l]) => { g.setLineDash([4, 4]); g.strokeStyle = c; g.beginPath(); g.moveTo(L, Y(z)); g.lineTo(cw - Rr, Y(z)); g.stroke(); g.setLineDash([]); g.fillStyle = c; g.textAlign = 'left'; g.fillText(l, L + 4, Y(z) - 3); });
    const line = (s, c) => { g.strokeStyle = c + '44'; g.lineWidth = 1.6; g.beginPath(); s.pts.forEach(([t, z], i) => i ? g.lineTo(X(t), Y(z)) : g.moveTo(X(t), Y(z))); g.stroke();
      const tl = tNow == null ? s.T : Math.min(tNow, s.T); g.strokeStyle = c; g.lineWidth = 2; g.beginPath(); let last = s.pts[0];
      for(let i = 0; i < s.pts.length; i++){ const [t, z] = s.pts[i]; if(i === 0){ g.moveTo(X(t), Y(z)); continue; } if(t <= tl){ g.lineTo(X(t), Y(z)); last = s.pts[i]; } else { const [tp, zp] = s.pts[i - 1], u = (tl - tp) / (t - tp); g.lineTo(X(tl), Y(zp + (z - zp) * u)); last = [tl, zp + (z - zp) * u]; break; } }
      g.stroke(); g.beginPath(); g.arc(X(last[0]), Y(last[1]), 3.5, 0, 2 * PI); g.fillStyle = c; g.fill(); };
    line(b, '#1F6FB2'); line(a, '#B4410E');
    g.font = '600 11px IBM Plex Mono, monospace'; g.textAlign = 'right'; g.fillStyle = '#B4410E'; g.fillText(`G73 · ${fmt(a.T, 1)} s`, cw - Rr, Tp + 10); g.fillStyle = '#1F6FB2'; g.fillText(`G83 · ${fmt(b.T, 1)} s`, cw - Rr, Tp + 24);
    if(tNow != null){ g.strokeStyle = '#26364B'; g.lineWidth = 1; g.beginPath(); g.moveTo(X(Math.min(tNow, Tm)), Tp); g.lineTo(X(Math.min(tNow, Tm)), ch - Bt); g.stroke(); }
  }
  function animate(){
    cancelAnimationFrame(anim); if(!res || !res.a) return; t0 = performance.now(); const Tm = Math.max(res.a.T, res.b.T);
    const f = now => { if(!$('cmpCv')) return; const t = (now - t0) / 1000; draw(t); $('cmpT').textContent = `${fmt(Math.min(t, Tm), 1)} s${t >= res.a.T ? ' · G73 terminou' : ''}${t >= res.b.T ? ' · G83 terminou' : ''}`; if(t < Tm + 0.3) anim = requestAnimationFrame(f); };
    anim = requestAnimationFrame(f);
  }
  function mount(){ if(!$('cmp')) return; $('cmp').addEventListener('change', run); $('cmpPlay').onclick = animate; run(); new ResizeObserver(() => draw(null)).observe($('cmpCv')); }
  return {html, mount, run};
})();
/* ===================== Navegação e progresso ===================== */
const GROUPS = ['Comece aqui', 'Fundamentos', 'Máquinas', 'Avançado', 'Prática'];
const STUDY = VIEWS.filter(v => !['inicio', 'exercicios', 'tabelas', 'glossario'].includes(v.id)).map(v => v.id);
const ROAD = [
  {l:'b', t:'Básico', d:'O que cada máquina faz e as grandezas que todo cálculo usa.', ids:['movimentos', 'ferramentas', 'furadeira', 'torno']},
  {l:'i', t:'Intermediário', d:'Força, potência, desgaste e tolerância: o que separa um parâmetro possível de um impossível.', ids:['forcas', 'desgaste', 'acabamento', 'mandrilhadora', 'centro', 'tempos']},
  {l:'a', t:'Avançado', d:'Limites reais da máquina, vibração, programação CNC e planejamento de processo.', ids:['potencia', 'rigidez', 'cnc', 'processo']}
];
let done = new Set(store.get('done', []));
let current = null;
VIEWS[0].head.meta = [['Módulos', String(VIEWS.length)], ['Máquinas em 3D', '4'], ['Calculadoras', '12 + simulador CNC']];

function renderNav(){
  let h = '';
  GROUPS.forEach(g => {
    h += `<span class="sb-group">${g}</span>`;
    VIEWS.filter(v => v.group === g).forEach(v => {
      h += `<button class="nav-item" data-v="${v.id}" title="${esc(v.label)}" ${v.id === current ? 'aria-current="page"' : ''}>${ic(v.icon)}<span class="nav-label">${esc(v.label)}</span>${STUDY.includes(v.id) ? `<span class="nav-done ${done.has(v.id) ? 'on' : ''}" aria-label="${done.has(v.id) ? 'estudado' : 'não estudado'}"></span>` : ''}</button>`;
    });
  });
  const akb = $('nav').querySelector('.ak-navbtn'); $('nav').innerHTML = h; if(akb) $('nav').appendChild(akb);
  const on = $('nav').querySelector('[aria-current="page"]'); if(on) on.scrollIntoView({block:'nearest', inline:'center'});
  const n = STUDY.filter(i => done.has(i)).length;
  $('progTxt').textContent = `${n}/${STUDY.length} módulos`;
  $('progBar').style.width = (n / STUDY.length * 100) + '%';
}
function renderRoad(){
  const el = $('road'); if(!el) return;
  el.innerHTML = ROAD.map(r => `<div class="card"><div>${H.lvl(r.l)}</div><h4 style="margin-top:4px">${r.t}</h4><p>${r.d}</p><div class="mods">${r.ids.map(id => { const v = VIEWS.find(x => x.id === id); return `<button type="button" data-go="${id}">${ic(v.icon)}<span>${esc(v.label)}</span><span class="nav-done ${done.has(id) ? 'on' : ''}"></span></button>`; }).join('')}</div></div>`).join('');
}
function go(id, push = true){
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  Viewer.unmount(); GSim.unmount();
  current = v.id; store.set('view', v.id);
  if(push){ try{ history.replaceState(null, '', '#' + v.id); }catch(e){} }
  $('hLabel').textContent = v.head.label;
  $('hTitle').innerHTML = v.head.title;
  $('hDesc').textContent = v.head.desc;
  $('hMeta').innerHTML = (v.lvl ? H.lvl(v.lvl) : '') + (v.head.meta || []).map(([k, val]) => `<span class="badge">${k} <strong>${val}</strong></span>`).join('');
  document.title = (v.id === 'inicio' ? '' : v.label + ' · ') + 'Oficina de Usinagem';
  let html = v.render();
  if(STUDY.includes(v.id)){
    const i = STUDY.indexOf(v.id), nx = VIEWS.find(x => x.id === STUDY[i + 1]);
    html += `<div class="mark-done"><button class="btn ${done.has(v.id) ? '' : 'primary'}" id="mDone" aria-pressed="${done.has(v.id)}">${done.has(v.id) ? 'Estudado ✓' : 'Marcar como estudado'}</button>${nx ? `<button class="btn" data-go="${nx.id}">Próximo: ${esc(nx.label)}</button>` : `<button class="btn" data-go="exercicios">Ir para os exercícios</button>`}</div>`;
  }
  $('view').innerHTML = html;
  if(v.after) v.after();
  const md = $('mDone'); if(md) md.onclick = () => { done.has(v.id) ? done.delete(v.id) : done.add(v.id); store.set('done', [...done]); md.setAttribute('aria-pressed', String(done.has(v.id))); md.className = 'btn ' + (done.has(v.id) ? '' : 'primary'); md.textContent = done.has(v.id) ? 'Estudado ✓' : 'Marcar como estudado'; renderNav(); if(done.has(v.id)) toast('Módulo marcado como estudado'); };
  renderNav();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const n = e.target.closest('[data-v]'); if(n){ go(n.dataset.v); return; }
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); }
});
/* Esc volta um nível: módulo → início da oficina → hub */
document.addEventListener('keydown', e => { if(e.key !== 'Escape' || e.defaultPrevented) return;
  const a = document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ a.blur(); return; }
  if(current && current !== 'inicio'){ go('inicio'); return; }
  location.href = '../../index.html#m-usin'; });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(h && h !== current && VIEWS.some(v => v.id === h)) go(h, false); });

(function init(){
  const h = location.hash.slice(1);
  go(VIEWS.some(v => v.id === h) ? h : store.get('view', 'inicio'), true);
})();

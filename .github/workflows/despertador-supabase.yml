# Despertador do Supabase: faz uma consulta leve no banco a cada 3 dias
# para o projeto gratuito não ser pausado por inatividade.
# Precisa de dois secrets no repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       ex.: https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  a chave pública (anon)
name: Despertador Supabase
on:
  schedule:
    - cron: "17 11 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a tabela ping
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets ainda não configurados; nada a fazer."; exit 0; fi
          curl -fsS "$URL/rest/v1/ping?select=id,em" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo; echo "Supabase acordado."
